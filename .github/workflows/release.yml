name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - name: Build Chrome and Firefox packages
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.CONTRI_GITHUB_CLIENT_ID }}
        run: |
          npm run package
          npm run verify:package
          node scripts/package.mjs --firefox
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(awk '/^## /{n++} n==1' CHANGELOG.md)
          gh release create "$GITHUB_REF_NAME" contri-v*.zip contri-v*.zip.sha256 \
            --title "CONTRI $GITHUB_REF_NAME" --notes "$notes"
