name: Release

# Publishes a GitHub Release with the Chrome and Firefox packages, then hands the
# Chrome package to publish-store.yml, which uploads it to the Chrome Web Store.
# Runs when main gets a package.json version that has no release yet (the tag is
# created automatically), when a v* tag is pushed, or manually from the Actions tab.
# If the release already exists, its notes are re-synced from its own CHANGELOG.md entry.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Decide whether to release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="v$(node -p "require('./package.json').version")"
          echo "tag=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($version)"; exit 1
          fi
          if gh release view "$version" >/dev/null 2>&1; then
            echo "Release $version already exists; notes will be re-synced."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.version.outputs.publish == 'true'
        run: npm ci

      - if: steps.version.outputs.publish == 'true'
        run: npm test

      - name: Build Chrome and Firefox packages
        if: steps.version.outputs.publish == 'true'
        env:
          VITE_GITHUB_CLIENT_ID: ${{ vars.CONTRI_GITHUB_CLIENT_ID }}
        run: |
          npm run package
          npm run verify:package
          node scripts/package.mjs --firefox

      - name: Write release notes from CHANGELOG.md
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # The entry for this version, not whatever is on top: an "Unreleased" section
          # must never become the notes of the release before it.
          awk -v h="## ${TAG#v}" '
            index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) ~ /[ \t]/) { p = 1; print; next }
            /^## / { p = 0 }
            p' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "::error::CHANGELOG.md has no \"## ${TAG#v}\" entry"; exit 1
          fi
          cat >> notes.md <<'EOF'

          ### Install
          1. Download `contri-*.zip` below (not the source code) and unzip it.
          2. Open `chrome://extensions`, turn on **Developer mode**, click **Load unpacked** and pick the unzipped folder.
          3. Open any public GitHub repository. Firefox: use the `-firefox.zip` via `about:debugging` (experimental).
          EOF

      - name: Publish GitHub release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" contri-v*.zip contri-v*.zip.sha256 \
            --target "$GITHUB_SHA" --title "contri. $TAG" --notes-file notes.md --latest

      - name: Keep existing release notes in sync
        if: steps.version.outputs.publish == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          current="$(gh release view "$TAG" --json body -q .body)"
          if [[ "$current" == "$(cat notes.md)" ]]; then
            echo "Release notes for $TAG are up to date."
          else
            gh release edit "$TAG" --notes-file notes.md
            echo "Updated release notes for $TAG from CHANGELOG.md."
          fi

  # A release nobody uploads leaves store users on an old version. Skipped (with a notice)
  # until the store credentials are configured; see docs/STORE-SUBMISSION.md.
  store:
    name: Chrome Web Store
    needs: release
    if: needs.release.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/publish-store.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
