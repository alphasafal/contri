name: Feed

# Rebuilds the public data behind the website's "Free right now" list, the reply-time
# leaderboard and the README badges (feed/ in the source), and publishes it as static
# JSON on the feed-data branch. The website reads it from raw.githubusercontent.com,
# so there is still no CONTRI server.
#
# The workflow token is enough. GitHub's per-minute search limit sets the pace (the run
# waits a minute each time it reaches it): about two projects a minute, so the default of
# four per language takes roughly 25 minutes. After 40 minutes it stops starting new
# projects and publishes what it has. FEED_REPOS_PER_LANGUAGE (variable, 12 at most)
# lists more or fewer; FEED_TOKEN is an optional secret for a token of your own.
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:feed
      - name: Fetch the previous list
        # Projects it holds stay listed for 30 days, so their README badges keep working on
        # days when search does not pick them. No previous list just means a fresh start.
        run: |
          curl -fsS --max-time 30 -o previous-repos.json \
            "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/feed-data/repos.json" \
            || echo "::notice::No previous list was found; starting afresh."
      - name: Read GitHub and write the data
        env:
          GITHUB_TOKEN: ${{ secrets.FEED_TOKEN || github.token }}
          FEED_REPOS_PER_LANGUAGE: ${{ vars.FEED_REPOS_PER_LANGUAGE }}
        run: node feed/dist/feed.js feed-out previous-repos.json
      - name: Publish to the feed-data branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          cd feed-out
          cat > README.md <<'TEXT'
          # CONTRI feed data

          Generated by the Feed workflow on the `main` branch (see `feed/`). Do not edit by hand:
          this branch is replaced on every run.

          - `free-issues.json`: good first issues that looked free when checked
          - `repos.json`: projects ranked by median first reply to outside contributors
          - `badge/<owner>/<repo>.json`: shields.io endpoint badges
          TEXT
          git init -q -b feed-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Feed data $(date -u +%Y-%m-%d)"
          git push -q --force "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" feed-data
          echo "Published $(find . -name '*.json' | wc -l) files to the feed-data branch." >> "$GITHUB_STEP_SUMMARY"
