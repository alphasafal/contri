name: Publish contri-mcp

# Publishes mcp/ to npm as `contri-mcp` with provenance, so agents can run
# `npx contri-mcp` instead of cloning and building, then lists the server in
# the official MCP Registry (mcp/server.json, GitHub OIDC, no secret). Runs on
# an `mcp-v*` tag (mcp-v0.2.0 publishes mcp/package.json version 0.2.0) or
# manually.
#
# One-time setup on npmjs.com: package `contri-mcp` → Settings → Trusted
# publisher → GitHub Actions, repository alphasafal/contri, workflow
# publish-mcp.yml. No NPM_TOKEN secret is needed after that.
on:
  push:
    tags: ['mcp-v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-mcp
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Check the tag, server.json and mcpName match mcp/package.json
        run: |
          version="$(node -p "require('./mcp/package.json').version")"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "mcp-v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mcp/package.json (mcp-v$version)"; exit 1
          fi
          node -e '
            const pkg = require("./mcp/package.json"), srv = require("./mcp/server.json");
            const bad = [];
            if (srv.version !== pkg.version) bad.push(`server.json version ${srv.version} != ${pkg.version}`);
            if (srv.packages[0].version !== pkg.version) bad.push("server.json packages[0].version differs");
            if (srv.name !== pkg.mcpName) bad.push(`server.json name ${srv.name} != mcpName ${pkg.mcpName}`);
            if (srv.packages[0].identifier !== pkg.name) bad.push("server.json identifier != package name");
            if (bad.length) { console.error(bad.join("\n")); process.exit(1); }
          '
      - run: npm test
      - run: npm run build:mcp
      - name: Smoke-test the built server
        run: |
          node mcp/dist/contri-mcp.js --version
          node mcp/dist/contri-mcp.js --help | head -3
      - name: Publish with provenance
        run: npm publish --workspace contri-mcp --access public --provenance

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher
      - name: Publish to the MCP Registry (GitHub OIDC)
        working-directory: mcp
        run: |
          ../mcp-publisher login github-oidc
          ../mcp-publisher publish
